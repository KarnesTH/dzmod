[project]
name = "dzmod"
version = "0.1.0"
description = "Check, update and install DayZ workshop mods via SteamCMD"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
dzmod = 'dzmod.cli:main'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"